<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TruckPulse — Vehicle Simulation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <!-- Leaflet.js — FREE OpenStreetMap -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
/* ============================================================
   TruckPulse — iOS 27 Liquid Glass Design System
   Holographic panels · animated borders · cyber grid · neon glow
   ============================================================ */

:root {
  --bg-0: #030810;
  --bg-1: #060d1c;
  --bg-2: #0a1428;

  /* Liquid glass layers */
  --glass-bg: rgba(12, 20, 42, 0.55);
  --glass-bg-hover: rgba(18, 30, 58, 0.65);
  --glass-border: rgba(80, 140, 220, 0.12);
  --glass-border-hover: rgba(80, 160, 240, 0.25);
  --glass-blur: 20px;
  --glass-shine: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, transparent 50%, rgba(255,255,255,0.02) 100%);

  /* Panel (legacy alias) */
  --panel: var(--glass-bg);
  --panel-solid: #0c1428;
  --border: var(--glass-border);
  --border-strong: rgba(100, 170, 255, 0.3);
  --text: #e4edff;
  --muted: #7e9cc4;
  --faint: #4a6890;

  /* Status colors */
  --ok: #34d399;
  --ok-dim: rgba(52, 211, 153, 0.12);
  --ok-glow: rgba(52, 211, 153, 0.35);
  --warn: #fbbf24;
  --warn-dim: rgba(251, 191, 36, 0.12);
  --warn-glow: rgba(251, 191, 36, 0.35);
  --bad: #f87171;
  --bad-dim: rgba(248, 113, 113, 0.12);
  --bad-glow: rgba(248, 113, 113, 0.35);
  --cyan: #22d3ee;
  --cyan-glow: rgba(34, 211, 238, 0.35);
  --purple: #a78bfa;
  --pink: #f472b6;

  /* Neon accents */
  --neon-cyan: 0 0 12px rgba(34,211,238,0.4), 0 0 40px rgba(34,211,238,0.15);
  --neon-purple: 0 0 12px rgba(167,139,250,0.4), 0 0 40px rgba(167,139,250,0.15);
  --neon-ok: 0 0 12px rgba(52,211,153,0.4), 0 0 40px rgba(52,211,153,0.12);
  --neon-bad: 0 0 12px rgba(248,113,113,0.45), 0 0 40px rgba(248,113,113,0.15);

  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 16px 64px rgba(0, 0, 0, 0.6), 0 4px 16px rgba(0, 0, 0, 0.4);

  --font: 'Space Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  font-family: var(--font);
  color: var(--text);
  background: var(--bg-0);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* ============ CYBER GRID BACKGROUND ============ */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(34, 211, 238, 0.07), transparent 55%),
    radial-gradient(900px 700px at 100% 0%, rgba(167, 139, 250, 0.05), transparent 50%),
    linear-gradient(180deg, var(--bg-1), var(--bg-0) 60%);
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.04;
  background-image:
    linear-gradient(rgba(34, 211, 238, 0.5) 1px, transparent 1px),
    linear-gradient(90deg, rgba(34, 211, 238, 0.5) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.5) 0%, transparent 70%);
  -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.5) 0%, transparent 70%);
}

/* Floating ambient orbs */
.bg-orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.2;
  pointer-events: none;
  z-index: 0;
  animation: orbFloat 16s ease-in-out infinite alternate;
}
.bg-orb.o1 { width: 500px; height: 500px; top: -15%; left: -8%; background: rgba(34,211,238,0.15); }
.bg-orb.o2 { width: 400px; height: 400px; top: 40%; right: -10%; background: rgba(167,139,250,0.12); animation-delay: 4s; }
.bg-orb.o3 { width: 350px; height: 350px; bottom: 0%; left: 25%; background: rgba(244,114,182,0.08); animation-delay: 8s; }

@keyframes orbFloat {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(40px, -50px) scale(1.15); }
}

.mono { font-family: var(--mono); }

#app { max-width: 1640px; margin: 0 auto; padding: 14px 18px 40px; position: relative; z-index: 1; }

/* ============================================================
   LIQUID GLASS PANEL — core reusable element
   ============================================================ */
.liquid-glass {
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  position: relative;
  transition: border-color 0.35s, box-shadow 0.35s, transform 0.25s;
}

/* Holographic shine overlay */
.liquid-glass::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: var(--glass-shine);
  pointer-events: none;
  z-index: 1;
}
.liquid-glass:hover {
  border-color: var(--glass-border-hover);
  box-shadow: var(--shadow-lg), 0 0 30px rgba(34, 211, 238, 0.08);
}
.liquid-glass:hover::after { opacity: 1; }

/* ============ HEADER ============ */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 20px;
  margin-bottom: 14px;
  background: rgba(8, 14, 30, 0.7);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(80, 140, 220, 0.1);
  border-radius: var(--radius);
  box-shadow: 0 8px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.04);
  position: sticky;
  top: 8px;
  z-index: 40;
}

.brand { display: flex; align-items: center; gap: 12px; }
.brand-logo {
  font-size: 26px;
  filter: drop-shadow(0 0 12px rgba(34, 211, 238, 0.6));
  animation: floaty 4s ease-in-out infinite;
}
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

.brand-name {
  font-weight: 700;
  font-size: 19px;
  letter-spacing: 3.5px;
  background: linear-gradient(90deg, #7dd3fc, #22d3ee 30%, #a78bfa 60%, #f472b6 90%);
  background-size: 200% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: gradientShift 6s ease-in-out infinite;
}
@keyframes gradientShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
.brand-sub { display: block; font-size: 9px; letter-spacing: 2.8px; color: var(--faint); font-weight: 500; }

.header-center { display: flex; align-items: center; gap: 10px; }
.hdr-status { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: 1.4px; color: var(--muted); font-weight: 600; }
.hdr-dot {
  width: 9px; height: 9px; border-radius: 50%; background: var(--cyan);
  box-shadow: 0 0 8px var(--cyan-glow);
}
.hdr-dot.pulse { animation: dotPulse 1.6s ease-in-out infinite; }
@keyframes dotPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.6); opacity: 1; }
  50% { box-shadow: 0 0 0 8px rgba(34, 211, 238, 0); opacity: 0.7; }
}
.hdr-band {
  font-size: 11px; font-weight: 700; letter-spacing: 1.2px;
  padding: 5px 14px; border-radius: 20px; border: 1px solid;
  backdrop-filter: blur(8px);
}
.hdr-band.band-healthy { color: var(--ok); border-color: rgba(52,211,153,0.4); background: var(--ok-dim); box-shadow: var(--neon-ok); }
.hdr-band.band-attention { color: var(--warn); border-color: rgba(251,191,36,0.4); background: var(--warn-dim); box-shadow: 0 0 12px var(--warn-glow); }
.hdr-band.band-critical { color: var(--bad); border-color: rgba(248,113,113,0.45); background: var(--bad-dim); box-shadow: var(--neon-bad); animation: criticalPulse 1.5s ease-in-out infinite; }
@keyframes criticalPulse {
  0%, 100% { box-shadow: 0 0 12px rgba(248,113,113,0.4); }
  50% { box-shadow: 0 0 24px rgba(248,113,113,0.6); }
}

.header-right { display: flex; align-items: center; gap: 12px; }
.icon-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(20, 34, 60, 0.5); color: var(--muted);
  border: 1px solid rgba(80, 140, 220, 0.12); border-radius: 20px;
  padding: 6px 14px; font-size: 11px; letter-spacing: 1px;
  cursor: pointer; font-family: var(--font); transition: all 0.25s;
  backdrop-filter: blur(8px);
}
.icon-btn:hover { border-color: var(--glass-border-hover); color: var(--text); background: rgba(30, 50, 85, 0.6); box-shadow: 0 0 16px rgba(34,211,238,0.1); }
.icon-btn.on { color: var(--ok); border-color: rgba(52,211,153,0.5); background: var(--ok-dim); box-shadow: var(--neon-ok); }
.clock { font-family: var(--mono); font-size: 15px; color: var(--cyan); letter-spacing: 2px; text-shadow: 0 0 10px var(--cyan-glow); }

/* ============ PANELS ============ */
.main-grid {
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr) 340px;
  gap: 14px;
  align-items: start;
}
.col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.status-row { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 14px; }

.panel {
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px 17px;
  position: relative;
  transition: border-color 0.35s, box-shadow 0.35s, transform 0.25s;
}

.panel:hover {
  border-color: var(--glass-border-hover);
  box-shadow: var(--shadow-lg), 0 0 24px rgba(34,211,238,0.06);
  transform: translateY(-1px);
}

.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.panel-title { font-size: 13px; font-weight: 700; letter-spacing: 1.6px; color: var(--text); display: flex; align-items: center; gap: 7px; }
.panel-sub { font-size: 10px; letter-spacing: 1px; color: var(--faint); text-transform: uppercase; }

.live-chip {
  font-size: 10px; font-weight: 700; letter-spacing: 1.4px;
  padding: 4px 12px; border-radius: 20px;
  backdrop-filter: blur(8px);
}
.live-chip.running { color: var(--ok); background: var(--ok-dim); border: 1px solid rgba(52,211,153,0.35); box-shadow: var(--neon-ok); }
.live-chip.paused { color: var(--muted); background: rgba(80,110,160,0.12); border: 1px solid var(--border); }

/* ============ SIM CONTROLS ============ */
.sim-controls { display: flex; flex-direction: column; gap: 13px; }
.btn-row { display: flex; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: var(--radius-sm); border: 1px solid var(--glass-border);
  background: rgba(18, 30, 55, 0.5); color: var(--text);
  font-family: var(--font); font-size: 12.5px; font-weight: 600; letter-spacing: 1px;
  padding: 11px 12px; cursor: pointer; transition: all 0.22s;
  flex: 1; backdrop-filter: blur(10px); position: relative; overflow: hidden;
}
.btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--glass-shine);
  pointer-events: none;
}
.btn:hover { border-color: var(--glass-border-hover); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
.btn:active { transform: translateY(0); }

.btn-start {
  flex: 2.2;
  background: linear-gradient(135deg, rgba(34, 211, 238, 0.2), rgba(34, 211, 238, 0.06));
  border-color: rgba(34, 211, 238, 0.4); color: #bdf2ff;
  box-shadow: 0 0 20px rgba(34,211,238,0.1);
}
.btn-start:hover { box-shadow: 0 0 30px rgba(34, 211, 238, 0.25), 0 4px 16px rgba(0,0,0,0.3); }
.btn-start.is-paused {
  background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(251, 191, 36, 0.05));
  border-color: rgba(251,191,36,0.5); color: #ffe6a8;
  box-shadow: 0 0 20px rgba(251,191,36,0.1);
}
.btn-reset { color: var(--muted); }

.ctrl-group { display: flex; flex-direction: column; gap: 8px; }
.ctrl-label { font-size: 9.5px; letter-spacing: 2.4px; color: var(--faint); font-weight: 600; }

.scenario-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.scenario-btn {
  display: flex; align-items: center; gap: 7px;
  padding: 9px 10px; border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border); background: rgba(14, 24, 48, 0.6);
  color: var(--muted); font-family: var(--font); font-size: 11.5px; font-weight: 600;
  cursor: pointer; transition: all 0.2s; text-align: left;
  backdrop-filter: blur(8px); position: relative; overflow: hidden;
}
.scenario-btn::before { content: ''; position: absolute; inset: 0; background: var(--glass-shine); pointer-events: none; }
.scenario-btn:hover { color: var(--text); border-color: var(--glass-border-hover); transform: translateY(-1px); }
.scenario-btn .scn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; transition: all 0.25s; }
.scenario-btn[data-scenario="OVERHEATING"] .scn-dot { background: #fb923c; box-shadow: 0 0 6px rgba(251,146,60,0.5); }
.scenario-btn[data-scenario="LOW_VOLTAGE"] .scn-dot { background: #60a5fa; box-shadow: 0 0 6px rgba(96,165,250,0.5); }
.scenario-btn[data-scenario="HIGH_VIBRATION"] .scn-dot { background: #f472b6; box-shadow: 0 0 6px rgba(244,114,182,0.5); }
.scenario-btn[data-scenario="ENGINE_INSTABILITY"] .scn-dot { background: #a78bfa; box-shadow: 0 0 6px rgba(167,139,250,0.5); }
.scenario-btn[data-scenario="CRITICAL_FAILURE"] .scn-dot { background: #f87171; box-shadow: 0 0 6px rgba(248,113,113,0.5); }
.scenario-btn[data-scenario="RECOVERY"] .scn-dot { background: #34d399; box-shadow: 0 0 6px rgba(52,211,153,0.5); }

.scenario-btn.active {
  background: linear-gradient(135deg, rgba(34, 211, 238, 0.18), rgba(34, 211, 238, 0.04));
  border-color: rgba(34, 211, 238, 0.55); color: var(--text);
  box-shadow: 0 0 18px rgba(34, 211, 238, 0.15);
}
.scenario-btn.active[data-scenario="CRITICAL_FAILURE"] { border-color: rgba(248,113,113,0.6); box-shadow: 0 0 18px rgba(248,113,113,0.2); }
.scenario-btn.active[data-scenario="RECOVERY"] { border-color: rgba(52,211,153,0.6); box-shadow: 0 0 18px rgba(52,211,153,0.18); }
.scenario-btn.active .scn-dot { background: #22d3ee; box-shadow: 0 0 8px var(--cyan-glow); }
.scenario-btn.active[data-scenario="CRITICAL_FAILURE"] .scn-dot { background: #f87171; box-shadow: 0 0 8px var(--bad-glow); }
.scenario-btn.active[data-scenario="RECOVERY"] .scn-dot { background: #34d399; box-shadow: 0 0 8px var(--ok-glow); }

.segmented { display: flex; border: 1px solid var(--glass-border); border-radius: var(--radius-sm); overflow: hidden; background: rgba(8, 14, 30, 0.6); backdrop-filter: blur(8px); }
.seg-btn {
  flex: 1; padding: 8px 0; border: none; background: transparent;
  color: var(--muted); font-family: var(--mono); font-size: 12px; font-weight: 600;
  cursor: pointer; transition: all 0.2s; border-right: 1px solid var(--glass-border);
}
.seg-btn:last-child { border-right: none; }
.seg-btn:hover { color: var(--text); background: rgba(34,211,238,0.04); }
.seg-btn.active {
  background: linear-gradient(135deg, rgba(34,211,238,0.25), rgba(34,211,238,0.08));
  color: #d9f8ff;
  box-shadow: inset 0 -2px 0 var(--cyan);
}

.btn-maintenance {
  width: 100%;
  background: linear-gradient(135deg, rgba(52, 211, 153, 0.18), rgba(52, 211, 153, 0.05));
  border-color: rgba(52, 211, 153, 0.4); color: #bdf5dd;
}
.btn-maintenance:hover { box-shadow: 0 0 24px rgba(52, 211, 153, 0.25); }
.btn-maintenance.pulse { animation: maintPulse 1.8s ease-in-out infinite; }
@keyframes maintPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.35); }
  50% { box-shadow: 0 0 0 10px rgba(52, 211, 153, 0); }
}
.maintenance-hint { font-size: 10.5px; color: var(--faint); line-height: 1.5; text-align: center; }

/* ============ FLEET ============ */
.fleet-list { display: flex; flex-direction: column; gap: 8px; }
.fleet-card {
  display: flex; flex-direction: column; gap: 5px;
  padding: 10px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border); background: rgba(12, 22, 44, 0.55);
  color: var(--text); cursor: pointer; text-align: left; font-family: var(--font);
  transition: all 0.22s; width: 100%;
  backdrop-filter: blur(10px); position: relative; overflow: hidden;
}

.fleet-card:hover { border-color: var(--glass-border-hover); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
.fleet-card.active {
  border-color: rgba(34, 211, 238, 0.55);
  background: linear-gradient(135deg, rgba(34,211,238,0.1), rgba(12,22,44,0.55));
  box-shadow: 0 0 20px rgba(34,211,238,0.12), 0 6px 20px rgba(0,0,0,0.3);
}
.fleet-card-top { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 1; }
.fleet-name { font-weight: 700; font-size: 13px; }
.fleet-status-dot { font-size: 9px; color: var(--faint); }
.fleet-status-dot.band-healthy { color: var(--ok); text-shadow: 0 0 6px var(--ok-glow); }
.fleet-status-dot.band-attention { color: var(--warn); text-shadow: 0 0 6px var(--warn-glow); }
.fleet-status-dot.band-critical { color: var(--bad); animation: dotPulseBad 1.4s infinite; text-shadow: 0 0 6px var(--bad-glow); }
@keyframes dotPulseBad { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
.fleet-plate { font-size: 10px; color: var(--faint); letter-spacing: 1px; position: relative; z-index: 1; }
.fleet-health-row { display: flex; align-items: baseline; gap: 4px; position: relative; z-index: 1; }
.fleet-health-val { font-family: var(--mono); font-size: 20px; font-weight: 600; color: var(--text); }
.fleet-health-max { font-size: 10px; color: var(--faint); }
.fleet-band-chip { margin-left: auto; font-size: 12px; }
.fleet-route { font-size: 9.5px; color: var(--cyan); letter-spacing: 0.3px; opacity: 0.8; text-shadow: 0 0 6px var(--cyan-glow); position: relative; z-index: 1; }
.fleet-bar { height: 5px; border-radius: 4px; background: rgba(30, 50, 80, 0.5); overflow: hidden; position: relative; z-index: 1; }
.fleet-bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s ease; }
.fleet-bar-fill.band-healthy { background: linear-gradient(90deg, #10b981, var(--ok)); box-shadow: 0 0 8px var(--ok-glow); }
.fleet-bar-fill.band-attention { background: linear-gradient(90deg, #d97706, var(--warn)); box-shadow: 0 0 8px var(--warn-glow); }
.fleet-bar-fill.band-critical { background: linear-gradient(90deg, #dc2626, var(--bad)); box-shadow: 0 0 8px var(--bad-glow); }

/* ============ HEALTH SCORE ============ */
.health-main { display: flex; gap: 16px; align-items: center; }
.ring-wrap { position: relative; flex: none; }
.ring { transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: rgba(50, 80, 130, 0.2); stroke-width: 9; }
.ring-fg {
  fill: none; stroke: var(--ok); stroke-width: 9; stroke-linecap: round;
  stroke-dasharray: 339.3; stroke-dashoffset: 339.3;
  transition: stroke-dashoffset 0.4s ease, stroke 0.4s ease;
  filter: drop-shadow(0 0 8px rgba(52, 211, 153, 0.6));
}
.ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-value { font-family: var(--mono); font-size: 34px; font-weight: 700; line-height: 1; text-shadow: 0 0 12px rgba(34,211,238,0.3); }
.ring-max { font-size: 10px; color: var(--faint); letter-spacing: 1px; }

.health-meta { display: flex; flex-direction: column; gap: 9px; flex: 1; min-width: 0; }
.status-badge {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 12.5px; font-weight: 700; letter-spacing: 1.6px;
  padding: 6px 14px; border-radius: 20px; width: fit-content;
  border: 1px solid; backdrop-filter: blur(8px);
}
.status-badge.band-healthy { color: var(--ok); border-color: rgba(52,211,153,0.4); background: var(--ok-dim); box-shadow: var(--neon-ok); }
.status-badge.band-attention { color: var(--warn); border-color: rgba(251,191,36,0.4); background: var(--warn-dim); box-shadow: 0 0 12px var(--warn-glow); }
.status-badge.band-critical { color: var(--bad); border-color: rgba(248,113,113,0.45); background: var(--bad-dim); box-shadow: var(--neon-bad); animation: badgeShake 1.2s ease-in-out infinite; }
@keyframes badgeShake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-2px); } 40% { transform: translateX(2px); }
  60% { transform: translateX(-1px); } 80% { transform: translateX(1px); }
}
.meta-chips { display: flex; gap: 8px; }
.chip {
  display: flex; flex-direction: column; gap: 2px;
  background: rgba(14, 26, 50, 0.6); border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm); padding: 6px 10px;
  backdrop-filter: blur(8px); transition: border-color 0.25s;
}
.chip:hover { border-color: var(--glass-border-hover); }
.chip-label { font-size: 8.5px; letter-spacing: 1.8px; color: var(--faint); }
.chip-value { font-family: var(--mono); font-size: 14px; font-weight: 600; }
.chip-value.risk-low { color: var(--ok); text-shadow: 0 0 6px var(--ok-glow); }
.chip-value.risk-medium { color: var(--warn); text-shadow: 0 0 6px var(--warn-glow); }
.chip-value.risk-high { color: var(--bad); text-shadow: 0 0 6px var(--bad-glow); }
.conf-bar { height: 5px; border-radius: 4px; background: rgba(30, 50, 80, 0.5); overflow: hidden; }
.conf-fill { height: 100%; border-radius: 4px; background: var(--ok); transition: width 0.4s ease; box-shadow: 0 0 6px var(--ok-glow); }
.veh-identity { font-size: 10px; color: var(--faint); letter-spacing: 1px; }

.component-breakdown { display: flex; flex-direction: column; gap: 6px; margin-top: 13px; padding-top: 12px; border-top: 1px dashed var(--glass-border); }
.comp-row { display: flex; align-items: center; gap: 9px; }
.comp-label { font-size: 10px; color: var(--muted); width: 62px; flex: none; letter-spacing: 0.4px; }
.comp-bar { flex: 1; height: 6px; border-radius: 4px; background: rgba(30, 50, 80, 0.45); overflow: hidden; }
.comp-fill { height: 100%; border-radius: 4px; transition: width 0.35s ease, background 0.35s ease; }
.comp-val { font-size: 10.5px; width: 24px; text-align: right; color: var(--muted); }

/* ============ VEHICLE VISUALIZATION ============ */
.vehicle-stage { position: relative; }
.status-pulse { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; letter-spacing: 1.2px; color: var(--muted); font-weight: 600; }
.pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan-glow); }
.status-pulse.band-healthy .pulse-dot { background: var(--ok); box-shadow: 0 0 10px var(--ok-glow); animation: dotPulse 1.6s infinite; }
.status-pulse.band-attention .pulse-dot { background: var(--warn); box-shadow: 0 0 10px var(--warn-glow); animation: dotPulse 1.3s infinite; }
.status-pulse.band-critical .pulse-dot { background: var(--bad); box-shadow: 0 0 10px var(--bad-glow); animation: dotPulseBad 0.9s infinite; }

.truck-svg { width: 100%; height: auto; display: block; position: relative; z-index: 2; }
.conn-svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
.conn-line {
  fill: none; stroke: rgba(34, 211, 238, 0.35); stroke-width: 1.4;
  stroke-dasharray: 5 7; animation: dashFlow 1.6s linear infinite;
  filter: drop-shadow(0 0 4px var(--cyan-glow));
}
@keyframes dashFlow { to { stroke-dashoffset: -24; } }

.gauge {
  position: absolute; z-index: 3;
  display: flex; flex-direction: column; gap: 1px;
  background: rgba(8, 16, 32, 0.88); border: 1px solid rgba(80, 140, 220, 0.25);
  border-radius: 10px; padding: 6px 10px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5), 0 0 8px rgba(34,211,238,0.08);
  backdrop-filter: blur(12px);
}
.gauge-label { font-size: 8px; letter-spacing: 1.6px; color: var(--faint); }
.gauge-val { font-size: 12.5px; font-weight: 600; color: var(--cyan); white-space: nowrap; text-shadow: 0 0 6px var(--cyan-glow); }
.g-rpm { top: 8px; left: 8px; }
.g-temp { top: 74px; left: 8px; }
.g-volt { top: 8px; right: 8px; }
.g-vib { top: 74px; right: 8px; }

.veh-glow { transition: opacity 0.8s ease; }
.wheel { transition: transform 0.05s linear; }
.data-pulse { animation: datapulse 1.4s ease-in-out infinite; }
.data-pulse.p2 { animation-delay: 0.5s; }
@keyframes datapulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

.vehicle-footer { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.veh-tag { font-size: 10px; letter-spacing: 1px; color: var(--faint); }
.ok-text { color: var(--ok); text-shadow: 0 0 4px var(--ok-glow); }
.warn-text { color: var(--warn); text-shadow: 0 0 4px var(--warn-glow); }
.bad-text { color: var(--bad); font-weight: 600; text-shadow: 0 0 4px var(--bad-glow); }

/* ============ TELEMETRY ============ */
.metric-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 9px; }
.metric-card {
  background: rgba(10, 20, 40, 0.55); border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm); padding: 11px 12px;
  display: flex; flex-direction: column; gap: 6px;
  transition: all 0.25s; backdrop-filter: blur(10px);
  position: relative; overflow: hidden;
}

.metric-card:hover { border-color: var(--glass-border-hover); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
.metric-head { display: flex; align-items: center; gap: 6px; }
.metric-icon { font-size: 13px; }
.metric-label { font-size: 9.5px; letter-spacing: 1.3px; color: var(--muted); text-transform: uppercase; }
.metric-value { font-size: 17px; font-weight: 600; color: var(--text); transition: color 0.3s; }
.metric-bar { height: 5px; border-radius: 4px; background: rgba(30, 50, 80, 0.5); overflow: hidden; }
.metric-fill { height: 100%; border-radius: 4px; transition: width 0.12s linear, background 0.3s ease; }
.metric-foot { display: flex; justify-content: space-between; align-items: center; }
.metric-state { font-size: 9px; letter-spacing: 1px; font-weight: 600; }
.metric-state.ok { color: var(--ok); text-shadow: 0 0 4px var(--ok-glow); }
.metric-state.warn { color: var(--warn); text-shadow: 0 0 4px var(--warn-glow); }
.metric-state.bad { color: var(--bad); text-shadow: 0 0 4px var(--bad-glow); }
.metric-unit { font-size: 9px; color: var(--faint); }

/* ============ CHARTS ============ */
.chart-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.chart-card {
  background: rgba(8, 16, 34, 0.55); border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm); padding: 11px 11px 7px;
  backdrop-filter: blur(10px); position: relative; overflow: hidden;
}


.chart-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.chart-label { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; color: var(--muted); text-transform: uppercase; }
.chart-now { font-size: 13px; color: var(--text); font-weight: 600; }
.chart-card canvas { width: 100%; display: block; border-radius: 6px; }

/* ============ AI ANALYSIS ============ */
.ai-state-chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 9.5px; font-weight: 700; letter-spacing: 1.4px; color: var(--ok);
  border: 1px solid rgba(52, 211, 153, 0.4); background: var(--ok-dim);
  padding: 4px 12px; border-radius: 20px;
  box-shadow: var(--neon-ok); backdrop-filter: blur(8px);
}
.ai-state-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); animation: dotPulse 1.5s infinite; box-shadow: 0 0 6px var(--ok-glow); }

.ai-body { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
.ai-core-wrap { position: relative; flex: none; }
.ai-core { display: block; }
.ai-core-center {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; pointer-events: none;
}
.ai-core-icon { font-size: 24px; filter: drop-shadow(0 0 10px rgba(34, 211, 238, 0.6)); animation: floaty 3s ease-in-out infinite; }
.ai-core-health { font-size: 18px; font-weight: 700; color: var(--text); text-shadow: 0 0 8px rgba(34,211,238,0.3); }
.ai-verdict {
  flex: 1; font-size: 12.5px; line-height: 1.55; color: var(--muted);
  background: rgba(10, 18, 36, 0.55); border: 1px dashed var(--glass-border);
  border-radius: var(--radius-sm); padding: 12px 13px; min-height: 74px;
  display: flex; align-items: center;
  backdrop-filter: blur(8px);
}

.ai-section { margin-top: 12px; }
.ai-section-title { font-size: 9.5px; letter-spacing: 2.2px; color: var(--faint); font-weight: 600; margin-bottom: 7px; }
.ai-patterns, .ai-actions { display: flex; flex-direction: column; gap: 6px; }
.ai-pattern {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; padding: 8px 10px; border-radius: var(--radius-sm);
  background: rgba(251, 191, 36, 0.07); border: 1px solid rgba(251, 191, 36, 0.28);
  color: #ffe3a3; backdrop-filter: blur(6px);
}
.ai-pattern.sev-high {
  background: rgba(248, 113, 113, 0.08); border-color: rgba(248, 113, 113, 0.35); color: #ffc9c9;
  box-shadow: 0 0 8px rgba(248,113,113,0.1);
}
.ai-pattern-icon { font-size: 11px; }
.ai-empty { font-size: 11.5px; color: var(--faint); font-style: italic; padding: 4px 2px; }
.ai-action { font-size: 12px; color: var(--muted); padding: 5px 2px; }
.ai-action:first-child { color: #bdf5dd; font-weight: 600; text-shadow: 0 0 4px var(--ok-glow); }

/* ============ TIMELINE ============ */
.timeline-list { display: flex; flex-direction: column; gap: 2px; max-height: 300px; overflow-y: auto; padding-right: 3px; }
.timeline-list::-webkit-scrollbar { width: 5px; }
.timeline-list::-webkit-scrollbar-track { background: transparent; }
.timeline-list::-webkit-scrollbar-thumb { background: rgba(80,140,220,0.25); border-radius: 3px; }
.timeline-entry {
  display: flex; align-items: baseline; gap: 8px;
  font-size: 11.5px; padding: 5px 7px; border-radius: 6px;
  border-left: 2px solid var(--glass-border);
  animation: slideIn 0.3s ease; backdrop-filter: blur(4px);
}
@keyframes slideIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }
.timeline-entry.lvl-warn { border-left-color: var(--warn); background: rgba(251,191,36,0.04); }
.timeline-entry.lvl-critical { border-left-color: var(--bad); background: rgba(248,113,113,0.05); box-shadow: inset 0 0 12px rgba(248,113,113,0.05); }
.timeline-entry.lvl-info { border-left-color: var(--cyan); }
.timeline-time { font-size: 9.5px; color: var(--faint); flex: none; }
.timeline-icon { flex: none; font-size: 11px; }
.timeline-text { color: var(--muted); line-height: 1.4; }
.timeline-entry.lvl-critical .timeline-text { color: #ffd0d0; }
.timeline-entry.lvl-warn .timeline-text { color: #ffe8b8; }
.timeline-empty { font-size: 11.5px; color: var(--faint); font-style: italic; padding: 8px 2px; }

/* ============ ALERT CENTER ============ */
.ac-list { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; padding-right: 3px; }
.ac-list::-webkit-scrollbar { width: 5px; }
.ac-list::-webkit-scrollbar-track { background: transparent; }
.ac-list::-webkit-scrollbar-thumb { background: rgba(80,140,220,0.25); border-radius: 3px; }
.ac-empty { font-size: 11.5px; color: var(--faint); font-style: italic; padding: 8px 2px; }
.ac-entry {
  border: 1px solid var(--glass-border); border-radius: var(--radius-sm);
  padding: 9px 11px; font-size: 11.5px; background: rgba(12, 22, 44, 0.55);
  animation: slideIn 0.35s ease; backdrop-filter: blur(8px);
  position: relative; overflow: hidden;
}
.ac-entry::before { content: ''; position: absolute; inset: 0; background: var(--glass-shine); pointer-events: none; }
.ac-entry > * { position: relative; z-index: 1; }
.ac-entry.lvl-warning { border-color: rgba(251,191,36,0.35); background: rgba(251,191,36,0.04); }
.ac-entry.lvl-critical { border-color: rgba(248,113,113,0.45); background: rgba(248,113,113,0.06); box-shadow: 0 0 10px rgba(248,113,113,0.08); }
.ac-entry.lvl-info { border-color: rgba(52,211,153,0.35); background: rgba(52,211,153,0.04); }
.ac-head { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.ac-title { font-weight: 700; font-size: 11.5px; }
.ac-entry.lvl-critical .ac-title { color: #ffc9c9; text-shadow: 0 0 4px var(--bad-glow); }
.ac-entry.lvl-warning .ac-title { color: #ffe8b8; }
.ac-time { font-size: 9px; color: var(--faint); flex: none; }
.ac-body { color: var(--muted); line-height: 1.45; margin-bottom: 5px; }
.ac-foot { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 10.5px; color: var(--faint); }
.ac-kv b { color: var(--text); font-weight: 600; }

/* ============ WHATSAPP PREVIEW ============ */
.wa-phone {
  background: #0b141a; border: 1px solid #1f2c33; border-radius: 20px;
  overflow: hidden; font-size: 12px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03), 0 10px 30px rgba(0,0,0,0.55);
}
.wa-header {
  display: flex; align-items: center; gap: 10px;
  background: #202c33; padding: 10px 13px;
}
.wa-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(135deg, #25d366, #128c7e);
  display: flex; align-items: center; justify-content: center; font-size: 17px;
  box-shadow: 0 0 10px rgba(37,211,102,0.3);
}
.wa-header-text { display: flex; flex-direction: column; line-height: 1.25; }
.wa-contact { font-weight: 700; color: #e9edef; font-size: 12.5px; }
.wa-status { font-size: 10px; color: #8696a0; }
.wa-more { margin-left: auto; color: #8696a0; font-size: 15px; }
.wa-chat {
  background:
    radial-gradient(circle at 20% 10%, rgba(37,211,102,0.04), transparent 50%),
    #0b141a;
  padding: 12px; min-height: 150px; display: flex; flex-direction: column; gap: 8px;
}
.wa-date { text-align: center; font-size: 9.5px; color: #8696a0; letter-spacing: 1px; }
.wa-bubble {
  background: #202c33; border-radius: 10px 10px 10px 2px;
  padding: 9px 11px; color: #e9edef; line-height: 1.5;
  border-left: 3px solid var(--warn);
  display: flex; flex-direction: column; gap: 3px;
  max-width: 100%; animation: slideIn 0.3s ease;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.wa-bubble.lvl-critical { border-left-color: var(--bad); background: #231d22; }
.wa-bubble.idle { border-left-color: var(--ok); }
.wa-bubble-title { font-weight: 700; font-size: 12px; margin-bottom: 3px; }
.wa-row { font-size: 11.5px; color: #c9d3d9; }
.wa-row b { color: #e9edef; font-weight: 600; }
.wa-time { font-size: 9.5px; color: #8696a0; text-align: right; margin-top: 4px; }
.wa-note { font-size: 10.5px; color: #8696a0; font-style: italic; text-align: center; padding: 8px 0; }
.wa-input-bar {
  display: flex; justify-content: space-between; align-items: center;
  background: #202c33; padding: 9px 13px; color: #8696a0; font-size: 11px;
}
.wa-send { color: #25d366; font-size: 14px; }

/* ============ ALERT BANNER ============ */
.alert-banner {
  display: flex; align-items: center; gap: 14px;
  border-radius: var(--radius); padding: 12px 16px; margin-bottom: 14px;
  animation: bannerIn 0.45s ease;
  backdrop-filter: blur(16px); position: relative; overflow: hidden;
}
.alert-banner::before { content: ''; position: absolute; inset: 0; background: var(--glass-shine); pointer-events: none; }
.alert-banner > * { position: relative; z-index: 1; }
@keyframes bannerIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
.alert-banner.warning {
  background: linear-gradient(90deg, rgba(251,191,36,0.15), rgba(251,191,36,0.04));
  border: 1px solid rgba(251,191,36,0.5); box-shadow: 0 0 20px rgba(251,191,36,0.12);
}
.alert-banner.critical {
  background: linear-gradient(90deg, rgba(248,113,113,0.18), rgba(248,113,113,0.04));
  border: 1px solid rgba(248,113,113,0.55); box-shadow: 0 0 20px rgba(248,113,113,0.15);
}
.banner-icon { font-size: 26px; animation: bannerPulse 1s ease-in-out infinite; flex: none; }
@keyframes bannerPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
.banner-main { flex: 1; min-width: 0; }
.banner-title { font-weight: 700; letter-spacing: 1.4px; font-size: 14px; }
.alert-banner.warning .banner-title { color: #ffe8b8; }
.alert-banner.critical .banner-title { color: #ffc9c9; text-shadow: 0 0 6px var(--bad-glow); }
.banner-msg { font-size: 12px; color: var(--muted); margin-top: 2px; }
.banner-meta { display: flex; gap: 16px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.banner-meta b { color: var(--text); }
.banner-reco { color: #bdf5dd; text-shadow: 0 0 4px var(--ok-glow); }
.banner-x {
  background: none; border: none; color: var(--faint); font-size: 15px; cursor: pointer; flex: none;
  transition: color 0.2s;
}
.banner-x:hover { color: var(--text); }

/* ============ TOASTS ============ */
.toast-stack {
  position: fixed; top: 74px; right: 18px; z-index: 100;
  display: flex; flex-direction: column; gap: 10px; width: 340px; max-width: calc(100vw - 36px);
}
.toast {
  display: flex; gap: 11px; align-items: flex-start;
  background: linear-gradient(160deg, rgba(16, 28, 52, 0.95), rgba(8, 14, 28, 0.95));
  border: 1px solid var(--border-strong); border-left: 4px solid var(--warn);
  border-radius: 14px; padding: 13px 14px; box-shadow: var(--shadow-lg);
  animation: toastIn 0.35s ease; backdrop-filter: blur(20px);
  position: relative; overflow: hidden;
}
.toast::before { content: ''; position: absolute; inset: 0; background: var(--glass-shine); pointer-events: none; }
.toast > * { position: relative; z-index: 1; }
.toast.lvl-critical { border-left-color: var(--bad); box-shadow: var(--shadow-lg), 0 0 20px rgba(248,113,113,0.12); }
.toast.lvl-info { border-left-color: var(--ok); box-shadow: var(--shadow-lg), 0 0 16px rgba(52,211,153,0.1); }
.toast.out { animation: toastOut 0.4s ease forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateX(40px); } }
.toast-icon { font-size: 20px; flex: none; }
.toast-title { font-weight: 700; font-size: 12.5px; letter-spacing: 1px; margin-bottom: 3px; }
.toast.lvl-critical .toast-title { color: #ffc9c9; }
.toast.lvl-warning .toast-title, .toast .toast-title { color: #ffe8b8; }
.toast.lvl-info .toast-title { color: #bdf5dd; }
.toast-msg { font-size: 11.5px; color: var(--muted); line-height: 1.45; }
.toast-meta { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 10.5px; color: var(--faint); margin-top: 5px; }
.toast-meta b { color: var(--text); }
.toast-close { background: none; border: none; color: var(--faint); cursor: pointer; font-size: 12px; margin-left: auto; flex: none; transition: color 0.2s; }
.toast-close:hover { color: var(--text); }

/* ============ TRANSITION TOAST ============ */
.transition-toast {
  position: fixed; top: 84px; left: 50%; transform: translateX(-50%);
  z-index: 110; background: rgba(10, 18, 36, 0.92); border: 1px solid rgba(34,211,238,0.45);
  border-radius: 24px; padding: 10px 24px; font-size: 12.5px; color: var(--text);
  letter-spacing: 0.6px;
  box-shadow: 0 0 30px rgba(34, 211, 238, 0.2), 0 8px 30px rgba(0,0,0,0.4);
  backdrop-filter: blur(16px);
  opacity: 0; transition: opacity 0.35s ease, transform 0.35s ease;
  pointer-events: none; white-space: nowrap;
}
.transition-toast.show { opacity: 1; transform: translateX(-50%) translateY(4px); }
.transition-toast b { color: #7dd3fc; text-shadow: 0 0 6px var(--cyan-glow); }
.hidden { display: none !important; }

/* ============ FOOTER ============ */
.app-footer {
  display: flex; justify-content: space-between; gap: 10px;
  margin-top: 20px; padding: 12px 6px;
  font-size: 10.5px; color: var(--faint); letter-spacing: 0.6px;
  border-top: 1px solid var(--glass-border);
}

/* ============ AUTH GATE ============ */
.auth-gate {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(3, 6, 14, 0.92);
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(12px);
  animation: fadeIn 0.4s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.auth-gate-card {
  background: linear-gradient(165deg, rgba(14, 24, 50, 0.92), rgba(6, 12, 26, 0.9));
  border: 1px solid rgba(80, 140, 220, 0.2);
  border-radius: 22px; padding: 40px 36px;
  text-align: center; max-width: 380px; width: 90%;
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6), 0 0 40px rgba(34,211,238,0.06);

/* ============ USER INFO ============ */
.user-info {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 14px; border-radius: 20px;
  background: rgba(20, 34, 60, 0.45); border: 1px solid var(--glass-border);
  font-size: 11px; backdrop-filter: blur(10px);
}
.user-avatar { font-size: 14px; }
.user-name { color: var(--text); font-weight: 600; letter-spacing: 0.5px; }
.user-role {
  font-family: var(--mono); font-size: 9px; letter-spacing: 1px;
  color: var(--cyan); background: rgba(34, 211, 238, 0.08);
  padding: 2px 8px; border-radius: 10px; border: 1px solid rgba(34, 211, 238, 0.25);
  text-transform: uppercase; text-shadow: 0 0 4px var(--cyan-glow);
}

/* ============ MAP ============ */
.map-panel { position: relative; }
.map-container { margin-top: 8px; }
.map-toggle-btn {
  width: 28px; height: 28px; border-radius: 8px;
  background: rgba(18, 30, 55, 0.6); border: 1px solid var(--glass-border);
  color: var(--muted); font-size: 12px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; backdrop-filter: blur(8px);
}
.map-toggle-btn:hover { border-color: var(--glass-border-hover); color: var(--text); }
.map-legend {
  display: flex; gap: 16px; margin-top: 8px; padding: 8px 0;
  justify-content: center; flex-wrap: wrap;
}
.legend-item {
  display: flex; align-items: center; gap: 6px;
  font-size: 10.5px; color: var(--faint); letter-spacing: 0.5px;
}
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }

/* Leaflet overrides */
.leaflet-container { background: #060d1c !important; border-radius: 12px; }
.leaflet-control-zoom { border: 1px solid var(--glass-border) !important; border-radius: 10px !important; overflow: hidden; }
.leaflet-control-zoom a {
  background: rgba(10, 18, 36, 0.88) !important;
  color: var(--muted) !important; border-color: var(--glass-border) !important;
  backdrop-filter: blur(8px);
}
.leaflet-control-zoom a:hover { color: var(--text) !important; background: rgba(16, 28, 50, 0.9) !important; }
.leaflet-control-attribution { background: rgba(6, 12, 26, 0.7) !important; color: var(--faint) !important; font-size: 9px !important; }
.leaflet-control-attribution a { color: var(--faint) !important; }

/* Truck marker */
.truck-marker { background: none !important; border: none !important; }
.marker-inner {
  display: flex; flex-direction: column; align-items: center;
  cursor: pointer; transition: transform 0.2s;
}
.marker-inner:hover { transform: scale(1.12); }
.marker-inner.marker-active { transform: scale(1.15); }
.marker-emoji { font-size: 22px; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6)); }
.marker-dot {
  width: 10px; height: 10px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.85);
  margin-bottom: -4px; position: relative; z-index: 2;
  box-shadow: 0 0 8px var(--cyan-glow);
}
.marker-label {
  font-size: 9px; font-weight: 700; letter-spacing: 0.8px;
  color: #fff; background: rgba(8, 14, 30, 0.88);
  padding: 2px 6px; border-radius: 6px; white-space: nowrap;
  border: 1px solid rgba(80,140,220,0.2); backdrop-filter: blur(8px);
}

/* Popup styling */
.leaflet-popup-content-wrapper {
  background: rgba(12, 22, 44, 0.95) !important;
  border: 1px solid rgba(80, 140, 220, 0.25) !important;
  border-radius: 14px !important;
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55), 0 0 16px rgba(34,211,238,0.08) !important;
  padding: 0 !important; backdrop-filter: blur(16px);
}
.leaflet-popup-tip { background: rgba(12, 22, 44, 0.95) !important; border: 1px solid rgba(80,140,220,0.25) !important; }
.leaflet-popup-close-button { color: var(--faint) !important; font-size: 18px !important; }
.leaflet-popup-close-button:hover { color: var(--text) !important; }

.popup-content { padding: 14px 16px; min-width: 200px; }
.popup-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.popup-icon { font-size: 24px; filter: drop-shadow(0 0 8px rgba(34,211,238,0.4)); }
.popup-name { font-weight: 700; font-size: 14px; letter-spacing: 0.5px; }
.popup-plate { font-size: 10px; color: var(--faint); letter-spacing: 1px; }
.popup-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.popup-stat { display: flex; flex-direction: column; gap: 2px; }
.popup-stat-label { font-size: 8px; letter-spacing: 1.5px; color: var(--faint); text-transform: uppercase; }
.popup-stat-val { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--text); }
.popup-scenario {
  font-size: 10px; color: var(--faint); letter-spacing: 0.5px;
  padding-top: 8px; border-top: 1px dashed var(--glass-border);
}

/* ============ ANALYSIS DASHBOARD ============ */
.analysis-section { margin-top: 14px; }
.analysis-section-title {
  font-size: 9.5px; letter-spacing: 2.2px; color: var(--faint);
  font-weight: 600; margin-bottom: 10px;
}
.fleet-summary-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
}
.summary-card {
  background: rgba(10, 20, 40, 0.55); border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm); padding: 10px 8px;
  text-align: center; transition: all 0.25s;
  backdrop-filter: blur(10px); position: relative; overflow: hidden;
}
.summary-card::before { content: ''; position: absolute; inset: 0; background: var(--glass-shine); pointer-events: none; }
.summary-card:hover { border-color: var(--glass-border-hover); transform: translateY(-1px); }
.summary-card > * { position: relative; z-index: 1; }
.summary-icon { font-size: 18px; margin-bottom: 4px; }
.summary-val { font-family: var(--mono); font-size: 18px; font-weight: 700; color: var(--text); }
.summary-label { font-size: 9px; color: var(--faint); letter-spacing: 0.8px; margin-top: 2px; }

.table-wrap { overflow-x: auto; }
.analysis-table {
  width: 100%; border-collapse: collapse; font-size: 11px;
}
.analysis-table th {
  text-align: left; padding: 7px 8px; font-size: 9px;
  letter-spacing: 1.5px; color: var(--faint); font-weight: 600;
  border-bottom: 1px solid var(--glass-border);
}
.analysis-table td {
  padding: 8px 8px; border-bottom: 1px solid rgba(80,140,220,0.06);
  color: var(--muted);
}
.analysis-table tr.row-active td {
  background: rgba(34, 211, 238, 0.05);
}
.table-vehicle { display: block; font-weight: 600; color: var(--text); }
.table-plate { display: block; font-size: 9px; color: var(--faint); letter-spacing: 0.8px; }
.band-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: 12px; font-size: 10px; font-weight: 600;
  letter-spacing: 0.5px;
}
.band-badge.band-healthy { color: var(--ok); background: var(--ok-dim); box-shadow: 0 0 6px rgba(52,211,153,0.15); }
.band-badge.band-attention { color: var(--warn); background: var(--warn-dim); }
.band-badge.band-critical { color: var(--bad); background: var(--bad-dim); box-shadow: 0 0 6px rgba(248,113,113,0.15); }

.fuel-chart-wrap { margin-top: 4px; }
.fuel-chart-wrap canvas { width: 100%; display: block; border-radius: 8px; }
.fuel-stats {
  display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; justify-content: center;
}
.fuel-stat-item {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; padding: 4px 10px; border-radius: 8px;
  background: rgba(10, 20, 40, 0.5); border: 1px solid var(--glass-border);
}
.fuel-stat-name { color: var(--faint); }
.fuel-stat-val { font-weight: 600; }

.maint-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px;
}
.maint-card {
  background: rgba(10, 20, 40, 0.55); border: 1px solid var(--glass-border);
  border-left: 3px solid var(--ok);
  border-radius: var(--radius-sm); padding: 10px 12px;
  transition: all 0.25s; backdrop-filter: blur(10px);
}
.maint-card:hover { border-color: var(--glass-border-hover); transform: translateY(-1px); }
.maint-vehicle { font-size: 11px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.maint-prediction { display: flex; align-items: baseline; gap: 6px; }
.maint-days { font-size: 18px; font-weight: 700; }
.maint-urgency { font-size: 9px; letter-spacing: 1.2px; font-weight: 600; }

.health-dist-wrap { margin-top: 4px; }
.health-dist-wrap canvas { width: 100%; display: block; border-radius: 8px; }

.export-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 11px 24px; border-radius: var(--radius-sm);
  background: linear-gradient(135deg, rgba(167, 139, 250, 0.18), rgba(167, 139, 250, 0.05));
  border: 1px solid rgba(167, 139, 250, 0.4);
  color: #c9b8ff; font-family: var(--font); font-size: 12px; font-weight: 600;
  letter-spacing: 1px; cursor: pointer; transition: all 0.25s;
  position: relative; overflow: hidden;
}
.export-btn::before { content: ''; position: absolute; inset: 0; background: var(--glass-shine); pointer-events: none; }
.export-btn:hover {
  box-shadow: 0 0 24px rgba(167, 139, 250, 0.2);
  transform: translateY(-1px);
}

/* ============ FLOATING ANIMATION ============ */
@keyframes floatUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.col-left .panel { animation: floatUp 0.5s ease backwards; }
.col-left .panel:nth-child(1) { animation-delay: 0.05s; }
.col-left .panel:nth-child(2) { animation-delay: 0.1s; }
.col-left .panel:nth-child(3) { animation-delay: 0.15s; }
.col-center .panel { animation: floatUp 0.5s ease backwards; }
.col-center .panel:nth-child(1) { animation-delay: 0.1s; }
.col-center .panel:nth-child(2) { animation-delay: 0.15s; }
.col-center .panel:nth-child(3) { animation-delay: 0.2s; }
.col-right .panel { animation: floatUp 0.5s ease backwards; }
.col-right .panel:nth-child(1) { animation-delay: 0.15s; }
.col-right .panel:nth-child(2) { animation-delay: 0.2s; }
.col-right .panel:nth-child(3) { animation-delay: 0.25s; }
.col-right .panel:nth-child(4) { animation-delay: 0.3s; }

/* ============ RESPONSIVE ============ */
@media (max-width: 1240px) {
  .main-grid { grid-template-columns: 280px minmax(0, 1fr); }
  .col-right { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: start; }
}
@media (max-width: 900px) {
  .main-grid { grid-template-columns: 1fr; }
  .col-right { grid-template-columns: 1fr; }
  .status-row { grid-template-columns: 1fr; }
  .health-main { justify-content: center; }
  .brand-sub { display: none; }
  .header-center .hdr-status .hdr-text { font-size: 10px; }
}
@media (max-width: 640px) {
  #app { padding: 10px; }
  .app-header { flex-wrap: wrap; gap: 8px; }
  .header-right { margin-left: auto; }
  .metric-grid { grid-template-columns: repeat(2, 1fr); }
  .chart-grid { grid-template-columns: 1fr; }
  .health-main { flex-direction: column; }
  .ai-body { flex-direction: column; }
  .ai-verdict { width: 100%; }
  .toast-stack { width: calc(100vw - 24px); right: 12px; }
  .scenario-grid { grid-template-columns: 1fr 1fr; }
  .banner-meta { gap: 6px 12px; }
  .transition-toast { white-space: normal; width: max-content; max-width: 92vw; text-align: center; }
  .gauge { padding: 3px 6px; }
  .gauge-val { font-size: 10.5px; }
  .gauge-label { font-size: 6.5px; }
}

              gate.style.display = "flex";
            }
            setTimeout(() => {
              if (gate) {
                gate.innerHTML = `
            <div class="auth-gate-card">
              <div class="auth-gate-icon">\u{1F44B}</div>
              <div class="auth-gate-title">Demo Mode</div>
              <div class="auth-gate-msg">Running in demo mode. Some features may be limited.</div>
              <a href="login.html" class="auth-gate-btn">Login for Full Access</a>
              <button class="auth-gate-btn" style="margin-top:8px;background:rgba(24,40,70,0.6);border-color:var(--border);color:var(--muted);" onclick="this.closest('.auth-gate').style.display='none'">Continue as Guest</button>
              <a href="home.html" style="display:block;margin-top:12px;font-size:11px;color:var(--faint);text-decoration:none;letter-spacing:0.5px;">\u2190 Back to Home</a>
            </div>
          `;
                gate.classList.remove("hidden");
              }
            }, 2e3);
          }
        }
        mount() {
          const $ = (id) => document.getElementById(id);
          try {
            this.controls = new SimulationControls($("sim-controls"), this);
          } catch (e) {
            console.error("Failed to init SimulationControls:", e);
          }
          try {
            this.fleet = new FleetPanel($("fleet-panel"), this);
          } catch (e) {
            console.error("Failed to init FleetPanel:", e);
          }
          try {
            this.healthScore = new HealthScore($("health-score"), this);
          } catch (e) {
            console.error("Failed to init HealthScore:", e);
          }
          try {
            this.vehicleVis = new VehicleVisualization($("vehicle-visual"), this);
          } catch (e) {
            console.error("Failed to init VehicleVisualization:", e);
          }
          try {
            this.telemetry = new TelemetryPanel($("telemetry"), this);
          } catch (e) {
            console.error("Failed to init TelemetryPanel:", e);
          }
          try {
            this.charts = new HealthChart($("charts"), this);
          } catch (e) {
            console.error("Failed to init HealthChart:", e);
          }
          try {
            this.aiPanel = new AIAnalysis($("ai-analysis"), this);
          } catch (e) {
            console.error("Failed to init AIAnalysis:", e);
          }
          try {
            this.timeline = new EventTimeline($("event-timeline"), this);
          } catch (e) {
            console.error("Failed to init EventTimeline:", e);
          }
          try {
            this.alertCenter = new AlertCenter($("alert-center"), this);
          } catch (e) {
            console.error("Failed to init AlertCenter:", e);
          }
          try {
            this.whatsapp = new WhatsAppPreview($("whatsapp-preview"), this);
          } catch (e) {
            console.error("Failed to init WhatsAppPreview:", e);
          }
          try {
            this.toasts = new Toasts($("toast-stack"));
          } catch (e) {
            console.error("Failed to init Toasts:", e);
          }
          try {
            this.fleetMap = new FleetMap($("fleet-map-section"), this);
          } catch (e) {
            console.error("Failed to init FleetMap:", e);
          }
          try {
            this.analysisDash = new AnalysisDashboard($("analysis-dashboard"), this);
          } catch (e) {
            console.error("Failed to init AnalysisDashboard:", e);
          }
          this.alertService.hooks.onBanner = (a) => this.renderBanner(a);
          this.alertService.hooks.onToast = (a) => this.toasts.show(a);
          this.alertService.hooks.onSound = (level) => this.audioService.play(level);
          this.alertService.hooks.onWhatsApp = () => {
          };
          const soundBtn = $("sound-toggle");
          if (soundBtn) {
            soundBtn.addEventListener("click", () => {
              this.audioService.setEnabled(!this.audioService.enabled);
              soundBtn.classList.toggle("on", this.audioService.enabled);
              this.toasts.showInfo(
                this.audioService.enabled ? "Alert sound enabled" : "Alert sound muted",
                this.audioService.enabled ? "\u{1F50A}" : "\u{1F507}"
              );
            });
          }
          const logoutBtn = $("logout-btn");
          if (logoutBtn) {
            logoutBtn.addEventListener("click", () => {
              sessionStorage.removeItem("truckpulse_session");
              this.toasts.showInfo("Logged out successfully", "\u{1F44B}");
              setTimeout(() => {
                window.location.href = "home.html";
              }, 800);
            });
          }
          try {
            this.runAnalysis();
          } catch (e) {
            console.error("Failed to run initial analysis:", e);
          }
          this.lastFrame = performance.now();
          this.simAccum = 0;
          this.frameId = requestAnimationFrame((t) => this.frame(t));
          this.clockTimer = setInterval(() => {
            const c = document.getElementById("clock");
            const f = document.getElementById("footer-clock");
            const t = fmtTime();
            if (c) c.textContent = t;
            if (f) f.textContent = t;
          }, 1e3);
          window.addEventListener("resize", () => {
            if (this.charts && this.charts.canvases) {
              Object.values(this.charts.canvases).forEach((c) => this.charts.sizeCanvas(c));
            }
          });
          window.addEventListener("beforeunload", () => this.destroy());
          document.addEventListener("visibilitychange", () => {
            this.lastFrame = performance.now();
          });
        }
        destroy() {
          cancelAnimationFrame(this.frameId);
          clearInterval(this.clockTimer);
        }
        // ================= THE ONE LOOP ============================
        frame(now) {
          this.frameId = requestAnimationFrame((t) => this.frame(t));
          const realDt = Math.min(now - this.lastFrame, 250);
          this.lastFrame = now;
          if (this.running) {
            this.simAccum += realDt * this.speed;
            while (this.simAccum >= tickMsAtSpeed(1)) {
              for (const t of this.trucks) t.sim.tick(250);
              this.simAccum -= 250;
            }
          }
          this.runAnalysis();
          this.renderAll(now);
        }
        runAnalysis() {
          const active = this.activeVehicle;
          const snapshot = active.sim.snapshot();
          active.analysis = this.ai.analyze(snapshot, {
            vehicleName: active.name,
            plate: active.plate
          });
          if (this.pendingSwitch) {
            this.ai.addTimelineEvent(`Switched to ${this.pendingSwitch.name} \u2014 telemetry loaded`, "\u{1F500}", "info");
            this.pendingSwitch = null;
          }
          if (this.pendingMaintenance && active.analysis.band === "HEALTHY" && active.sim.scenarioKey === "RECOVERY") {
            active.recovered = true;
            this.pendingMaintenance = false;
            this.ai.addTimelineEvent("Maintenance complete \u2014 vehicle recovered", "\u2705", "info");
            this.toasts.showInfo("Vehicle recovered \u2014 operating normally", "\u2705");
          }
          if (active.sim.scenarioKey === "RECOVERY" && active.analysis.band === "HEALTHY") {
            active.recovered = true;
          }
          for (const t of this.trucks) {
            if (t.id === active.id) continue;
            t.analysis = analyzeVehicleHealth(t.sim.snapshot());
          }
        }
        renderAll(now) {
          const v = this.activeVehicle;
          try {
            this.healthScore.update(v);
          } catch (e) {
          }
          try {
            this.vehicleVis.update(v);
          } catch (e) {
          }
          try {
            this.telemetry.update(v);
          } catch (e) {
          }
          try {
            this.charts.update(v);
          } catch (e) {
          }
          try {
            this.aiPanel.update(v, now);
          } catch (e) {
          }
          try {
            this.timeline.update();
          } catch (e) {
          }
          try {
            this.alertCenter.update();
          } catch (e) {
          }
          try {
            this.fleet.update();
          } catch (e) {
          }
          try {
            this.whatsapp.update(v);
          } catch (e) {
          }
          try {
            this.controls.sync(this);
          } catch (e) {
          }
          if (!this._mapFrame || now - this._mapFrame > 500) {
            try {
              this.fleetMap.update();
            } catch (e) {
            }
            try {
              this.analysisDash.updateAnalysis();
            } catch (e) {
            }
            this._mapFrame = now;
          }
          const chip = document.getElementById("vehicle-status-chip");
          const running = this.running;
          const band = v.analysis ? v.analysis.band : "HEALTHY";
          if (chip) {
            chip.innerHTML = `
        <span class="hdr-status">
          <span class="hdr-dot ${running ? "pulse" : ""}"></span>
          <span class="hdr-text">${running ? "SIMULATION ACTIVE" : "PAUSED"}</span>
        </span>
        <span class="hdr-band band-${band.toLowerCase()}">${band === "HEALTHY" ? "\u{1F7E2}" : band === "ATTENTION" ? "\u{1F7E1}" : "\u{1F534}"} ${band}</span>
      `;
          }
        }
      };
      var app = new App();
      window.truckPulseApp = app;
      app.mount();
    }
  });
  require_main();
})();

</script>
</body>
</html>
